name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"        # D1数据库的名字（截图中显示为cloud-mail）
database_id = "3ddc1bd9-d60b-422c-b652-c64b06d8ae57"   # 从Cloudflare D1详情页复制

[[kv_namespaces]]
binding = "kv"
id = "69fc76876eaa4d90845853060caa291a"               # 从Cloudflare KV详情页复制

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]	#每30分钟刷新分析缓存，每天晚上12点执行每日任务


[vars]
ai_model = "@cf/meta/llama-3.1-8b-instruct"			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
analysis_cache = true			#是否开启分析数据缓存
orm_log = true			#是否sql日志
domain = ["888591.xyz", "now.edu.kg"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@888591.xyz"				#管理员的邮箱	示例: admin@example.com
jwt_secret = "cedzis-saxsU4-soxqag"			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
